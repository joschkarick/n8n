services:
  mealie-mcp:
    build:
      context: .
      args:
        # Auf einen Tag oder Commit festnageln, sobald das Setup steht.
        MEALIE_MCP_REF: main
    container_name: mealie-mcp
    restart: unless-stopped
    env_file: .env
    # Der Container loest mealie.joschka.eu oeffentlich auf und laeuft ueber
    # den eigenen Router zurueck. Funktioniert nur, wenn das Setup Hairpin-NAT
    # beherrscht - und kostet auch dann einen Umweg. Zwei Alternativen:
    #
    #   a) Mealie laeuft woanders, etwa in einem eigenen LXC oder auf einem
    #      anderen Host: MEALIE_BASE_URL in der .env direkt auf dessen LAN-IP
    #      setzen, z. B. http://192.168.1.20:9000. Kein DNS, kein Router,
    #      kein Proxy dazwischen.
    #
    #   b) Mealie laeuft als Container auf derselben Docker-Instanz: beide ins
    #      selbe Netz haengen und MEALIE_BASE_URL auf http://mealie:9000
    #      setzen. Dafuer unten den networks-Block aktivieren.
    #
    # Beides ist optional - ueber die oeffentliche URL geht es auch.
    # BIND_ADDRESS entscheidet, wer den Dienst erreicht:
    #   127.0.0.1      NPMplus laeuft auf demselben Host (Vorgabe)
    #   192.168.2.40   NPMplus laeuft woanders im LAN - dann die LAN-IP
    #                  DIESES Hosts eintragen, nicht die von NPMplus
    # Steht hier 127.0.0.1, obwohl der Proxy woanders sitzt, laufen alle
    # externen Aufrufe ins Leere, waehrend lokal alles funktioniert.
    # Bewusst nicht 0.0.0.0: Hat der Host eine oeffentliche Adresse, stuende
    # der Endpunkt sonst am Proxy vorbei offen im Netz.
    # Der Port im Container bleibt immer 8000, nur die linke Seite variiert.
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-18000}:8000"
    # Variante fuer NPMplus in einem eigenen Docker-Netz: ports streichen,
    # stattdessen den networks-Block unten aktivieren und dort denselben
    # Netznamen eintragen, den "docker network ls" zeigt. Dann lautet der
    # Forward Hostname in NPMplus "mealie-mcp" statt "127.0.0.1".
    # networks:
    #   - proxy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

# Nur noetig, wenn NPMplus in einem eigenen Docker-Netz laeuft.
# networks:
#   proxy:
#     external: true
#     name: hier-den-namen-aus-docker-network-ls
