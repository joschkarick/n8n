services:
  mealie-mcp:
    build:
      context: .
      args:
        # Auf einen Tag oder Commit festnageln, sobald das Setup steht.
        MEALIE_MCP_REF: main
    container_name: mealie-mcp
    restart: unless-stopped
    env_file: .env
    # Haeufige Falle beim Selbsthosten: Der Container loest mealie.joschka.eu
    # oeffentlich auf und laeuft ueber den eigenen Router zurueck. Viele
    # Setups koennen dieses Hairpin-NAT nicht, die Verbindung haengt dann.
    # Abhilfe - eine der beiden Zeilen aktivieren:
    #   a) auf die LAN-IP des Hosts zeigen
    # extra_hosts:
    #   - "mealie.joschka.eu:192.168.1.10"
    #   b) oder MEALIE_BASE_URL in der .env direkt auf den Mealie-Container
    #      setzen und beide ins selbe Docker-Netz haengen
    # Nur an localhost gebunden. Damit kommt NPMplus im Host-Netz heran,
    # aus dem Internet aber niemand direkt - TLS und Auth laufen ueber den
    # Proxy bzw. das Gateway selbst. Niemals auf 0.0.0.0 aufmachen.
    # Host-Port ueber HOST_PORT in der .env aenderbar. Im Container bleibt es
    # immer 8000 - nur die linke Seite ist frei waehlbar.
    ports:
      - "127.0.0.1:${HOST_PORT:-18000}:8000"
    # Variante fuer NPMplus in einem eigenen Docker-Netz: ports streichen,
    # stattdessen den networks-Block unten aktivieren und dort denselben
    # Netznamen eintragen, den "docker network ls" zeigt. Dann lautet der
    # Forward Hostname in NPMplus "mealie-mcp" statt "127.0.0.1".
    # networks:
    #   - proxy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

# Nur noetig, wenn NPMplus in einem eigenen Docker-Netz laeuft.
# networks:
#   proxy:
#     external: true
#     name: hier-den-namen-aus-docker-network-ls
